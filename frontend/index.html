<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="BREAKER — um RPG investigativo de contratos Soroban na testnet do Stellar. Season 01: The First Layer."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BREAKER" />
    <meta property="og:title" content="BREAKER — The First Layer" />
    <meta
      property="og:description"
      content="Um RPG investigativo de contratos Soroban na testnet do Stellar. Season 01: The First Layer."
    />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta property="og:locale:alternate" content="es_ES" />
    <meta name="twitter:card" content="summary" />
    <meta name="theme-color" content="#05080d" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="BREAKER" />
    <title>BREAKER</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/images/brand/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="preload" href="/fonts/cormorant-garamond-latin-v21.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/ibm-plex-sans-latin-v23.woff2" as="font" type="font/woff2" crossorigin />
    <script data-breaker-hero-preload>
      (function () {
        var connection = navigator.connection;
        if (connection && connection.saveData) return;
        var covers = { 2: 1, 3: 1, 4: 1, 6: 1, 7: 1 };
        var base = null;
        var mobileHome = false;
        var login = false;
        var match = /^\/level\/(\d+)\/?$/.exec(location.pathname);
        if (match) {
          var id = Number(match[1]);
          if (id < 0 || id > 12) return;
          base = "/images/levels/" + String(id).padStart(2, "0") + (covers[id] ? "-cover" : "");
        } else if (location.pathname === "/") {
          mobileHome = window.matchMedia("(max-width: 640px)").matches;
          base = mobileHome
            ? "/images/levels/homepage-mobile"
            : "/images/levels/homepage";
        } else if (location.pathname === "/login") {
          login = true;
          base = "/images/login/meridian";
        } else {
          return;
        }
        if (login) {
          var logo = document.createElement("link");
          logo.rel = "preload";
          logo.as = "image";
          logo.type = "image/avif";
          logo.setAttribute(
            "imagesrcset",
            "/images/brand/breaker-logo-480.avif 480w, /images/brand/breaker-logo-768.avif 768w, /images/brand/breaker-logo-1200.avif 1200w",
          );
          logo.setAttribute("imagesizes", "(max-width: 640px) 100vw, 37rem");
          logo.setAttribute("fetchpriority", "high");
          document.head.appendChild(logo);
        }
        var link = document.createElement("link");
        link.rel = "preload";
        link.as = "image";
        link.type = mobileHome || login ? "image/avif" : "image/webp";
        var imageSet = login
          ? base + "-768.avif 768w, " + base + "-1200.avif 1200w, " + base + "-1672.avif 1672w"
          : mobileHome
            ? base + "-768.avif 768w, " + base + "-1024.avif 1024w"
            : base + "-768.webp 768w, " + base + "-1200.webp 1200w, " + base + ".webp 2048w";
        link.setAttribute(
          "imagesrcset",
          imageSet,
        );
        link.setAttribute("imagesizes", "100vw");
        link.setAttribute("fetchpriority", "high");
        document.head.appendChild(link);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
