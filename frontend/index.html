<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="BREAKER — um RPG investigativo de contratos Soroban na testnet do Stellar. Season 01: The First Layer."
    />
    <meta name="theme-color" content="#05080d" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="BREAKER" />
    <title>BREAKER</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/images/brand/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="preload" href="/fonts/cormorant-garamond-latin-v21.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/ibm-plex-sans-latin-v23.woff2" as="font" type="font/woff2" crossorigin />
    <script data-breaker-hero-preload>
      (function () {
        var connection = navigator.connection;
        if (connection && connection.saveData) return;
        var covers = { 2: 1, 3: 1, 4: 1, 6: 1, 7: 1 };
        var base = null;
        var mobileHome = false;
        var match = /^\/level\/(\d+)\/?$/.exec(location.pathname);
        if (match) {
          var id = Number(match[1]);
          if (id < 0 || id > 12) return;
          base = "/images/levels/" + String(id).padStart(2, "0") + (covers[id] ? "-cover" : "");
        } else if (location.pathname === "/") {
          mobileHome = window.matchMedia("(max-width: 640px)").matches;
          base = mobileHome
            ? "/images/levels/homepage-mobile"
            : "/images/levels/homepage";
        } else {
          return;
        }
        var link = document.createElement("link");
        link.rel = "preload";
        link.as = "image";
        link.type = mobileHome ? "image/avif" : "image/webp";
        var imageSet = mobileHome
          ? base + "-768.avif 768w, " + base + "-1024.avif 1024w"
          : base + "-768.webp 768w, " + base + "-1200.webp 1200w, " + base + ".webp 2048w";
        link.setAttribute(
          "imagesrcset",
          imageSet,
        );
        link.setAttribute("imagesizes", "100vw");
        link.setAttribute("fetchpriority", "high");
        document.head.appendChild(link);
      })();
    </script>
    <style>
      .boot {
        min-height: 100dvh;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 1rem;
        background: #05080d;
        color: #f1ead9;
      }
      .boot__mark {
        width: min(60vw, 220px);
        height: auto;
      }
      .boot__bar {
        width: min(50vw, 180px);
        height: 2px;
        overflow: hidden;
        background: rgb(127 208 220 / 18%);
      }
      .boot__bar i {
        display: block;
        width: 40%;
        height: 100%;
        background: #7fd0dc;
        animation: boot-slide 1.1s ease-in-out infinite;
      }
      .boot__label {
        color: #9fb7bb;
        font: 0.68rem ui-monospace, monospace;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      @keyframes boot-slide {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(350%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot__bar i {
          width: 100%;
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status" aria-live="polite">
        <img
          class="boot__mark"
          src="/images/brand/breaker-logo.webp"
          alt="BREAKER"
          fetchpriority="high"
        />
        <span class="boot__bar"><i></i></span>
        <span class="boot__label">Abrindo Meridian…</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
