name: keeper

on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:

concurrency:
  group: keeper
  cancel-in-progress: false

jobs:
  extend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    permissions:
      contents: read
      issues: write

    env:
      NETWORK: testnet

    steps:
      - uses: actions/checkout@v7

      - name: stellar-cli 28.0.0
        run: |
          curl -sSL --fail -o /tmp/stellar-cli.tar.gz \
            https://github.com/stellar/stellar-cli/releases/download/v28.0.0/stellar-cli-28.0.0-x86_64-unknown-linux-gnu.tar.gz
          echo "207544486734fccb4df1afc4a7745478f9f1e21688b2f9506f0ef36f60ce3fdc  /tmp/stellar-cli.tar.gz" | sha256sum -c -
          tar -xzf /tmp/stellar-cli.tar.gz -C /usr/local/bin
          stellar --version

      - name: the plan, before anything is signed
        run: ./scripts/keeper.sh --plan

      - name: extend
        env:
          SOURCE: ${{ secrets.KEEPER_SECRET }}
        run: |
          if [ -z "$SOURCE" ]; then
            echo "✗ the KEEPER_SECRET secret is not set on this repository." >&2
            echo "  Without it this job would extend nothing — silently, and every run" >&2
            echo "  would look like a keeper that works. Check scripts/keeper.sh, \"O keeper\"." >&2
            exit 1
          fi
          ./scripts/keeper.sh

      - name: open an issue, if the keeper failed
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const title = 'keeper: a TTL extension run failed'
            const body = [
              `The scheduled keeper failed at ${new Date().toISOString()}.`,
              '',
              `Run: ${url}`,
              '',
              'A keeper that stops is indistinguishable from one that works, until every',
              'entry is archived — and then there is nothing left to extend. This issue is',
              'the detector. Close it once a run has gone green again.',
            ].join('\n')

            const repo = { owner: context.repo.owner, repo: context.repo.repo }

            const open = await github.rest.issues.listForRepo({
              ...repo,
              state: 'open',
              per_page: 100,
            })

            const existing = open.data.find(i => i.title === title)

            if (existing) {
              await github.rest.issues.createComment({
                ...repo,
                issue_number: existing.number,
                body,
              })
            } else {
              const issue = await github.rest.issues.create({ ...repo, title, body })
              try {
                await github.rest.issues.addLabels({
                  ...repo,
                  issue_number: issue.data.number,
                  labels: ['keeper'],
                })
              } catch (e) {
                core.info(`could not add the keeper label: ${e.message}`)
              }
            }
